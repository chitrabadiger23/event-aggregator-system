<!DOCTYPE html>
<html>
<head>
<title>Event Detail</title>

<style>
body { font-family:Arial; background:#f5f5f5; padding:40px; }

.container {
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

.container img {
    width:100%;
    height:300px;
    object-fit:cover;
}

.btn {
    margin-top:20px;
    padding:12px 20px;
    background:black;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="container">

<img src="{{ event[5] if event[5] and 'http' in event[5] else url_for('static', filename='default.jpg') }}">

<h1>{{ event[1] }}</h1>
<p>📅 {{ event[2] }}</p>
<p>📍 {{ event[3] }}</p>

<a href="{{ event[4] }}" target="_blank">
<button class="btn">Know more</button>
</a>

</div>

</body>
</html>
